<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل مدیریت | ISO 17025</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand">🔬 پنل مدیریت</div>
      <div class="app-user"><span id="adminName"></span><button type="button" onclick="ISOAuth.logout()">خروج</button></div>
    </div>
  </header>
  <main class="app-main">
    <div class="panel">
      <h2>ایجاد دسترسی آزمایشگاه</h2>
      <form id="createUserForm" class="form-grid">
        <div><label>نام شرکت *</label><input name="companyName" required /></div>
        <div><label>تلفن</label><input name="phone" /></div>
        <div class="full"><label>آدرس</label><input name="address" /></div>
        <div><label>مدیر ارشد</label><input name="seniorManager" /></div>
        <div><label>مدیر فنی</label><input name="technicalManager" /></div>
        <div><label>نام کاربری *</label><input name="username" required autocomplete="off" /></div>
        <div><label>رمز عبور اولیه *</label><input name="password" type="text" required autocomplete="off" /></div>
        <div class="full"><button type="submit" class="btn btn-primary">ایجاد و ذخیره در سرور</button></div>
      </form>
      <p id="createMsg" style="margin-top:12px;font-size:0.9rem" hidden></p>
    </div>
    <div class="panel">
      <h2>آزمایشگاه‌های ثبت‌شده</h2>
      <div class="table-wrap">
        <table class="data-table" id="usersTable">
          <thead><tr><th>نام کاربری</th><th>شرکت</th><th>مدیر فنی</th><th>وضعیت</th><th>تاریخ</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="../js/auth.js"></script>
  <script>
    ISOAuth.initAuth().then(function () {
      var session = ISOAuth.requireAuth(['admin']);
      if (!session) return;
      document.getElementById('adminName').textContent = session.username;
      function renderUsers() {
        var list = ISOAuth.listLabUsers();
        document.querySelector('#usersTable tbody').innerHTML = list.map(function (u) {
          return '<tr><td><code>' + u.username + '</code></td><td>' + (u.company && u.company.name || '—') +
            '</td><td>' + (u.company && u.company.technicalManager || '—') +
            '</td><td>' + (u.company && u.company.setupComplete ? '✅' : '⏳') +
            '</td><td>' + new Date(u.createdAt).toLocaleDateString('fa-IR') + '</td></tr>';
        }).join('') || '<tr><td colspan="5">هنوز آزمایشگاهی ثبت نشده</td></tr>';
      }
      document.getElementById('createUserForm').onsubmit = async function (e) {
        e.preventDefault();
        var payload = Object.fromEntries(new FormData(e.target));
        var msg = document.getElementById('createMsg');
        msg.hidden = false;
        try {
          await ISOAuth.createLabUser(payload);
          msg.style.color = '#059669';
          msg.textContent = 'ایجاد شد و در GitHub ذخیره شد — یوزر: ' + payload.username;
          e.target.reset();
          renderUsers();
        } catch (err) {
          msg.style.color = '#dc2626';
          msg.textContent = err.message || String(err);
        }
      };
      renderUsers();
    });
  </script>
</body>
</html>
