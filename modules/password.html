<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تغییر رمز | ISO 17025</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand"><a href="../dashboard.html" style="color:inherit">← داشبورد</a> | تغییر رمز</div>
      <div class="app-user"><button onclick="ISOAuth.logout()">خروج</button></div>
    </div>
  </header>
  <div id="appNav"></div>
  <main class="app-main">
    <div class="panel" style="max-width:420px">
      <h2>تغییر رمز عبور</h2>
      <form id="pwForm" class="form-grid" style="grid-template-columns:1fr">
        <div><label>رمز فعلی</label><input type="password" id="oldPassword" required /></div>
        <div><label>رمز جدید</label><input type="password" id="newPassword" required minlength="6" /></div>
        <div><label>تکرار رمز جدید</label><input type="password" id="confirm" required minlength="6" /></div>
        <div class="full"><button type="submit" class="btn btn-primary">ذخیره</button></div>
      </form>
      <p id="msg" hidden style="margin-top:10px"></p>
    </div>
  </main>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    ISOAuth.initAuth().then(function () {
      var session = ISOAuth.requireAuth(['lab', 'admin']);
      if (!session) return;
      if (typeof renderAppNav === 'function') renderAppNav('dashboard');
      document.getElementById('pwForm').onsubmit = async function (e) {
        e.preventDefault();
        var msg = document.getElementById('msg');
        var oldP = document.getElementById('oldPassword').value;
        var newP = document.getElementById('newPassword').value;
        var conf = document.getElementById('confirm').value;
        if (newP !== conf) { msg.hidden = false; msg.style.color = '#dc2626'; msg.textContent = 'تکرار رمز یکسان نیست'; return; }
        try {
          await ISOAuth.changePassword(session.username, oldP, newP);
          msg.hidden = false; msg.style.color = '#059669'; msg.textContent = 'رمز با موفقیت تغییر کرد';
          e.target.reset();
        } catch (err) {
          msg.hidden = false; msg.style.color = '#dc2626'; msg.textContent = err.message;
        }
      };
    });
  </script>
</body>
</html>
