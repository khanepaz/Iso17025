<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جانشینان</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <header class="app-header"><div class="app-header-inner"><div class="app-brand"><a href="../dashboard.html" style="color:inherit">← داشبورد</a> | جانشینان</div><div class="app-user"><button onclick="ISOAuth.logout()">خروج</button></div></div></header>
  <main class="app-main">
    <div class="panel"><h2>تعیین جانشین</h2>
      <form id="depForm" class="form-grid">
        <div><label>فرد اصلی</label><select name="personId" id="personSelect" required></select></div>
        <div><label>جانشین</label><select name="deputyId" id="deputySelect" required></select></div>
        <div class="full"><button type="submit" class="btn btn-primary">ثبت</button></div>
      </form>
    </div>
    <div class="panel"><h2>جدول</h2><div class="table-wrap"><table class="data-table" id="tbl"><thead><tr><th>فرد</th><th>سمت</th><th>جانشین</th><th>سمت جانشین</th></tr></thead><tbody></tbody></table></div></div>
  </main>
  <script src="../js/auth.js"></script>
  <script>
    const session = ISOAuth.requireAuth(['lab']);
    let co = ISOAuth.getCompany(session.companyId);
    function fill() {
      const opts = (co.staff||[]).map(s => `<option value="${s.id}">${s.name} — ${s.position}</option>`).join('');
      document.getElementById('personSelect').innerHTML = opts;
      document.getElementById('deputySelect').innerHTML = opts;
    }
    function render() {
      co = ISOAuth.getCompany(session.companyId);
      const map = Object.fromEntries((co.staff||[]).map(s => [s.id, s]));
      const deps = co.matrices?.deputies || [];
      document.querySelector('#tbl tbody').innerHTML = deps.map(d => {
        const p = map[d.personId], dep = map[d.deputyId];
        return `<tr><td>${p?.name||'?'}</td><td>${p?.position||''}</td><td>${dep?.name||'?'}</td><td>${dep?.position||''}</td></tr>`;
      }).join('') || '<tr><td colspan="4">خالی</td></tr>';
    }
    document.getElementById('depForm').onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const personId = fd.get('personId'), deputyId = fd.get('deputyId');
      if (personId === deputyId) return alert('یکسان نیستند');
      co = ISOAuth.getCompany(session.companyId);
      const deps = [...(co.matrices?.deputies||[])];
      deps.push({ personId, deputyId });
      ISOAuth.updateCompany(session.companyId, { matrices: { ...(co.matrices||{}), deputies: deps } });
      render();
    };
    fill(); render();
  </script>
</body>
</html>
