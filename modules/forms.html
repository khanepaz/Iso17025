<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فرم‌ها | ISO 17025</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand">🔬 فرم‌ها و مستندات</div>
      <div class="app-user"><button onclick="ISOAuth.logout()">خروج</button></div>
    </div>
  </header>
  <div id="appNav"></div>
  <main class="app-main">
    <div class="panel">
      <h2>فرم‌های قابل چاپ / دانلود</h2>
      <p style="font-size:0.9rem;color:#64748b;margin-bottom:14px">روی «فرم چاپی» کلیک کنید و از مرورگر Save as PDF بگیرید. برای سربرگ شرکت از فرم شخصی‌سازی‌شده استفاده کنید.</p>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>کد</th><th>عنوان</th><th>لینک</th></tr></thead>
          <tbody id="formsBody"></tbody>
        </table>
      </div>
      <p style="margin-top:16px"><a class="btn btn-primary" href="branded-forms.html">فرم با نام و لوگوی شرکت</a></p>
    </div>
  </main>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    var FORMS = [
      { code: 'F-01', title: 'خط‌مشی بی‌طرفی', file: 'F-01-Impartiality-Policy' },
      { code: 'F-02', title: 'تعهدنامه بی‌طرفی کارکنان', file: 'F-02-Staff-Impartiality-Declaration' },
      { code: 'F-03', title: 'تعهدنامه محرمانگی', file: 'F-03-Confidentiality-Agreement' },
      { code: 'F-04', title: 'ارزیابی ریسک بی‌طرفی', file: 'F-04-Impartiality-Risk-Assessment' },
      { code: 'F-05', title: 'بازنگری قرارداد', file: 'F-05-Contract-Review' },
      { code: 'F-06', title: 'دریافت قلم آزمون', file: 'F-06-Item-Receipt' },
      { code: 'F-07', title: 'کار نامنطبق', file: 'F-07-Nonconforming-Work' },
      { code: 'F-08', title: 'ثبت شکایت', file: 'F-08-Complaint-Form' },
      { code: 'F-09', title: 'اقدام اصلاحی', file: 'F-09-Corrective-Action' },
      { code: 'F-10', title: 'ارزیابی شایستگی', file: 'F-10-Competence-Evaluation' }
    ];
    ISOAuth.initAuth().then(function () {
      var s = ISOAuth.requireAuth(['lab', 'admin']);
      if (!s) return;
      renderAppNav('forms');
      document.getElementById('formsBody').innerHTML = FORMS.map(function (f) {
        return '<tr><td><code>' + f.code + '</code></td><td>' + f.title +
          '</td><td><a href="../forms/' + f.file + '.html" target="_blank">فرم چاپی</a></td></tr>';
      }).join('');
    });
  </script>
</body>
</html>
