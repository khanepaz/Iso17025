<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدیریت پرسنل | ISO 17025</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand"><a href="../dashboard.html" style="color:inherit">← داشبورد</a> | پرسنل</div>
      <div class="app-user"><span id="userLabel"></span> <button onclick="ISOAuth.logout()">خروج</button></div>
    </div>
  </header>
  <div id="appNav"></div>
  <main class="app-main">
    <div class="panel">
      <h2 id="formTitle">افزودن پرسنل</h2>
      <p id="coHint" style="font-size:0.85rem;color:#64748b;margin-bottom:10px"></p>
      <form id="staffForm" class="form-grid">
        <input type="hidden" id="staffId" value="" />
        <div><label>نام و نام خانوادگی *</label><input id="stName" required autocomplete="name" /></div>
        <div><label>سمت *</label><input id="stPos" required /></div>
        <div><label>مدرک تحصیلی</label><input id="stEdu" placeholder="مثال: کارشناسی شیمی" /></div>
        <div>
          <label>نقش سازمانی</label>
          <select id="stRole">
            <option value="management">مدیریت</option>
            <option value="technical" selected>فنی</option>
            <option value="quality">کیفیت</option>
            <option value="support">پشتیبانی</option>
          </select>
        </div>
        <div class="full">
          <button type="submit" class="btn btn-primary" id="saveBtn">ذخیره پرسنل</button>
          <button type="button" id="cancelEdit" class="btn btn-outline" style="display:none;margin-right:8px;color:#0f4c81;border-color:#0f4c81">انصراف</button>
        </div>
      </form>
      <p id="msg" style="margin-top:10px;font-size:0.9rem" hidden></p>
    </div>
    <div class="panel">
      <h2>لیست پرسنل (<span id="count">0</span>)</h2>
      <div class="table-wrap">
        <table class="data-table" id="tbl">
          <thead><tr><th>نام</th><th>سمت</th><th>مدرک</th><th>نقش</th><th>عملیات</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    ISOAuth.initAuth().then(async function () {
      var session = ISOAuth.requireAuth(['lab']);
      if (!session) return;
      document.getElementById('userLabel').textContent = session.username;
      if (typeof renderAppNav === 'function') renderAppNav('staff');
      try { await ISOAuth.refresh(); } catch (e) {}
      var roleMap = { management: 'مدیریت', technical: 'فنی', quality: 'کیفیت', support: 'پشتیبانی' };
      var msg = document.getElementById('msg');
      function showMsg(text, ok) {
        msg.hidden = false;
        msg.style.color = ok ? '#059669' : '#dc2626';
        msg.textContent = text;
      }
      function render() {
        var co = ISOAuth.getCompany(session.companyId);
        if (!co) {
          showMsg('شرکت یافت نشد. از دامنه Netlify وارد شوید.', false);
          document.getElementById('coHint').textContent = 'خطا در بارگذاری شرکت';
          return;
        }
        document.getElementById('coHint').textContent =
          'شرکت: ' + (co.name || '—') + ' | داده از users.json';
        var staff = Array.isArray(co.staff) ? co.staff : [];
        document.getElementById('count').textContent = staff.length;
        document.querySelector('#tbl tbody').innerHTML = staff.map(function (s) {
          return '<tr><td>' + (s.name || '') + '</td><td>' + (s.position || '') + '</td><td>' +
            (s.education || '—') + '</td><td>' + (roleMap[s.role] || s.role || '') + '</td><td>' +
            '<button type="button" class="btn-edit" data-id="' + s.id + '">ویرایش</button> ' +
            '<button type="button" class="btn-del" data-id="' + s.id + '" style="color:#dc2626">حذف</button></td></tr>';
        }).join('') || '<tr><td colspan="5">هنوز پرسنلی ثبت نشده. از فرم بالا اضافه کنید.</td></tr>';
        document.querySelectorAll('.btn-del').forEach(function (btn) {
          btn.onclick = async function () {
            if (!confirm('حذف این نفر؟')) return;
            try {
              await ISOAuth.deleteStaff(session.companyId, btn.getAttribute('data-id'));
              await ISOAuth.refresh();
              showMsg('حذف شد', true);
              render();
            } catch (err) { showMsg(err.message || String(err), false); }
          };
        });
        document.querySelectorAll('.btn-edit').forEach(function (btn) {
          btn.onclick = function () {
            var id = btn.getAttribute('data-id');
            var s = (ISOAuth.getCompany(session.companyId).staff || []).find(function (x) { return x.id === id; });
            if (!s) return;
            document.getElementById('staffId').value = s.id;
            document.getElementById('stName').value = s.name || '';
            document.getElementById('stPos').value = s.position || '';
            document.getElementById('stEdu').value = s.education || '';
            document.getElementById('stRole').value = s.role || 'technical';
            document.getElementById('formTitle').textContent = 'ویرایش پرسنل';
            document.getElementById('cancelEdit').style.display = 'inline-flex';
          };
        });
      }
      document.getElementById('cancelEdit').onclick = function () {
        document.getElementById('staffForm').reset();
        document.getElementById('staffId').value = '';
        document.getElementById('formTitle').textContent = 'افزودن پرسنل';
        this.style.display = 'none';
      };
      document.getElementById('staffForm').onsubmit = async function (e) {
        e.preventDefault();
        var btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.textContent = 'در حال ذخیره...';
        var staff = {
          id: document.getElementById('staffId').value || undefined,
          name: document.getElementById('stName').value.trim(),
          position: document.getElementById('stPos').value.trim(),
          education: document.getElementById('stEdu').value.trim(),
          role: document.getElementById('stRole').value
        };
        if (!staff.id) delete staff.id;
        if (!staff.name || !staff.position) {
          showMsg('نام و سمت الزامی است', false);
          btn.disabled = false;
          btn.textContent = 'ذخیره پرسنل';
          return;
        }
        try {
          var res = await ISOAuth.upsertStaff(session.companyId, staff);
          showMsg('ذخیره شد — تعداد: ' + ((res && res.staff) ? res.staff.length : '✓'), true);
          e.target.reset();
          document.getElementById('staffId').value = '';
          document.getElementById('formTitle').textContent = 'افزودن پرسنل';
          document.getElementById('cancelEdit').style.display = 'none';
          await ISOAuth.refresh();
          render();
        } catch (err) {
          showMsg(err.message || String(err), false);
        }
        btn.disabled = false;
        btn.textContent = 'ذخیره پرسنل';
      };
      render();
    });
  </script>
</body>
</html>
