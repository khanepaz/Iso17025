<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اطلاعات شرکت | ISO 17025</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand"><a href="dashboard.html" style="color:inherit">← داشبورد</a> | اطلاعات شرکت</div>
      <div class="app-user"><span id="userLabel"></span> <button onclick="ISOAuth.logout()">خروج</button></div>
    </div>
  </header>
  <div id="appNav"></div>
  <main class="app-main">
    <div class="panel">
      <h2>اطلاعات شرکت</h2>
      <form id="companyForm" class="form-grid">
        <div><label>نام شرکت *</label><input id="coName" required /></div>
        <div><label>تلفن *</label><input id="coPhone" required /></div>
        <div class="full"><label>آدرس *</label><input id="coAddress" required /></div>
        <div><label>مدیر ارشد *</label><input id="coSenior" required /></div>
        <div><label>مدیر فنی *</label><input id="coTech" required /></div>
        <div class="full">
          <label>لوگوی شرکت (اختیاری — برای سربرگ فرم‌ها)</label>
          <input type="file" id="logoFile" accept="image/*" />
          <img id="logoPreview" alt="" style="max-height:64px;margin-top:8px;display:none" />
        </div>
        <div class="full"><button type="submit" class="btn btn-primary">ذخیره اطلاعات شرکت</button></div>
      </form>
      <p id="coMsg" hidden style="margin-top:10px"></p>
    </div>
    <div class="panel">
      <h2>پرسنل همین شرکت (<span id="stCount">0</span>)</h2>
      <p style="font-size:0.85rem;color:#64748b">همین لیست در مدیریت پرسنل، جانشینان و نفرات شاخص هم نمایش داده می‌شود. برای مدیریت کامل به <a href="modules/staff.html">مدیریت پرسنل</a> بروید.</p>
      <div class="table-wrap" style="margin-top:12px">
        <table class="data-table" id="staffTable">
          <thead><tr><th>نام</th><th>سمت</th><th>مدرک</th><th>نقش</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <a class="btn btn-primary" href="modules/staff.html" style="margin-top:12px;display:inline-block">مدیریت پرسنل (افزودن / ویرایش / حذف)</a>
    </div>
    <div class="panel" style="text-align:center" id="finishPanel">
      <button type="button" class="btn btn-primary" id="finishSetup">تأیید و رفتن به داشبورد</button>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    var logoDataUrl = '';
    ISOAuth.initAuth().then(async function () {
      var session = ISOAuth.requireAuth(['lab']);
      if (!session) return;
      document.getElementById('userLabel').textContent = session.username;
      if (typeof renderAppNav === 'function') renderAppNav('setup');
      await ISOAuth.refresh();
      var roleMap = { management: 'مدیریت', technical: 'فنی', quality: 'کیفیت', support: 'پشتیبانی' };
      function fill() {
        var company = ISOAuth.getCompany(session.companyId);
        if (!company) return;
        document.getElementById('coName').value = company.name || '';
        document.getElementById('coPhone').value = company.phone || '';
        document.getElementById('coAddress').value = company.address || '';
        document.getElementById('coSenior').value = company.seniorManager || '';
        document.getElementById('coTech').value = company.technicalManager || '';
        logoDataUrl = company.logoDataUrl || '';
        if (logoDataUrl) {
          var img = document.getElementById('logoPreview');
          img.src = logoDataUrl;
          img.style.display = 'block';
        }
        if (company.setupComplete) document.getElementById('finishPanel').style.display = 'none';
      }
      function renderStaff() {
        var company = ISOAuth.getCompany(session.companyId);
        var staff = (company && company.staff) || [];
        document.getElementById('stCount').textContent = staff.length;
        document.querySelector('#staffTable tbody').innerHTML = staff.map(function (s) {
          return '<tr><td>' + (s.name || '') + '</td><td>' + (s.position || '') + '</td><td>' +
            (s.education || '—') + '</td><td>' + (roleMap[s.role] || s.role || '') + '</td></tr>';
        }).join('') || '<tr><td colspan="4">خالی — از مدیریت پرسنل اضافه کنید</td></tr>';
      }
      document.getElementById('logoFile').onchange = function (e) {
        var file = e.target.files[0];
        if (!file) return;
        if (file.size > 400000) { alert('حجم لوگو حداکثر حدود ۴۰۰KB'); return; }
        var reader = new FileReader();
        reader.onload = function () {
          logoDataUrl = reader.result;
          var img = document.getElementById('logoPreview');
          img.src = logoDataUrl;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      };
      document.getElementById('companyForm').onsubmit = async function (e) {
        e.preventDefault();
        var updates = {
          name: document.getElementById('coName').value.trim(),
          phone: document.getElementById('coPhone').value.trim(),
          address: document.getElementById('coAddress').value.trim(),
          seniorManager: document.getElementById('coSenior').value.trim(),
          technicalManager: document.getElementById('coTech').value.trim(),
          logoDataUrl: logoDataUrl
        };
        var msg = document.getElementById('coMsg');
        try {
          await ISOAuth.updateCompany(session.companyId, updates);
          await ISOAuth.refresh();
          msg.hidden = false; msg.style.color = '#059669'; msg.textContent = 'ذخیره شد';
          fill(); renderStaff();
        } catch (err) {
          msg.hidden = false; msg.style.color = '#dc2626'; msg.textContent = err.message;
        }
      };
      document.getElementById('finishSetup').onclick = async function () {
        var company = ISOAuth.getCompany(session.companyId);
        if (!company || !company.name) { alert('نام شرکت را ذخیره کنید'); return; }
        if (!(company.staff && company.staff.length)) { alert('حداقل یک پرسنل از بخش مدیریت پرسنل لازم است'); return; }
        await ISOAuth.updateCompany(session.companyId, { setupComplete: true });
        location.href = 'dashboard.html';
      };
      fill();
      renderStaff();
    });
  </script>
</body>
</html>
